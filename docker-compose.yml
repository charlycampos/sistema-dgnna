      - "8002:8002"
    environment:
      - PORT=8002
      - "SESSION_SECRET=${SESSION_SECRET:?Debes definir SESSION_SECRET en tu archivo .env (ver .env.example)}"
      - DATABASE_URL=${DATABASE_URL_APELACIONES:-oracle+oracledb://apelaciones_db:Apelaciones2026@host.docker.internal:1521/?service_name=XEPDB1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
