    environment:
      - PORT=8006
      - SESSION_SECRET=${SESSION_SECRET:-dgnna-sistema-dgnna-secret-2026}
      - DATABASE_URL=${DATABASE_URL_TRANSPARENCIA:-oracle+oracledb://TRANSPARENCIA_DB:123456@host.docker.internal:1521/?service_name=XEPDB1}
    extra_hosts:
