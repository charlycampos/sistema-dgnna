  # ─────────────────────────────────────────────────────────────
  normativa-service:
    container_name: normativa-service-1
    build:
      context: ./servicios/servicio-normativa
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8011:8011"
    environment:
      - PORT=8011
      - "SESSION_SECRET=${SESSION_SECRET:?Debes definir SESSION_SECRET en tu archivo .env (ver .env.example)}"
      - DATABASE_URL=${DATABASE_URL_NORMATIVA:-oracle+oracledb://normativa_db:Normativa2026@host.docker.internal:1521/?service_name=XEPDB1}
      - AUDITORIA_SERVICE_URL=http://auditoria-service:8009
      - IA_HABILITADA=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_DEFAULT_PROVIDER=${LLM_DEFAULT_PROVIDER:-openai}
    volumes:
      - ./normativa:/app/normativa:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
