name: dgnna

networks:
  dgnna-net:
    driver: bridge

services:
  # ─────────────────────────────────────────────────────────────
  # 0. BALANCEADOR DE CARGA / PROXY REVERSO (NGINX)
  # ─────────────────────────────────────────────────────────────
  load-balancer:
    image: nginx:alpine
    container_name: dgnna-load-balancer
    restart: unless-stopped
    mem_limit: 50m
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - dgnna-net

  # ─────────────────────────────────────────────────────────────
  # 1. FRONTEND
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 400m
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - "SESSION_SECRET=${SESSION_SECRET:?Debes definir SESSION_SECRET en tu archivo .env (ver .env.example)}"
      - BACKEND_URL=http://load-balancer:8000
      - BACKEND_INTERNAL_URL=http://load-balancer:8000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - load-balancer
    networks:
      - dgnna-net

  # ─────────────────────────────────────────────────────────────
  # 2. API GATEWAY (Instancia Principal)
  # ─────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./servicios/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 200m
    environment:
      - "SESSION_SECRET=${SESSION_SECRET:?Debes definir SESSION_SECRET en tu archivo .env (ver .env.example)}"
      - AUTH_SERVICE_URL=http://auth-service:8001
      - APELACIONES_SERVICE_URL=http://apelaciones-service:8002
      - SUSTRACION_SERVICE_URL=http://sustracion-service:8003
      - SALA_SERVICE_URL=http://sala-service:8004
      - PROYECTOS_LEY_SERVICE_URL=http://proyectosley-service:8005
      - TRANSPARENCIA_SERVICE_URL=http://transparencia-service:8006
      - POI_PP117_SERVICE_URL=http://poi-service:8007
      - MAPA_SERVICE_URL=http://mapa-service:8008
      - AUDITORIA_SERVICE_URL=http://auditoria-service:8009
      - PREVENIR_PROTEGER_SERVICE_URL=http://prevenir-service:8010
      - NORMATIVA_SERVICE_URL=http://normativa-service:8011
      - TABLEROS_SERVICE_URL=http://tableros-service:8012
      - AYUDA_MEMORIA_SERVICE_URL=http://ayuda-memoria-service:8013
      - GESTION_DATOS_SERVICE_URL=http://gestion-datos-service:8014
    networks:
      - dgnna-net

  # ─────────────────────────────────────────────────────────────
  # 2.1 API GATEWAY (Segunda Réplica - Alta Disponibilidad OGTI)
  # Se activa únicamente con: docker compose --profile ha up -d
  # En desarrollo local permanece apagado (0 consumo de RAM).
  # ─────────────────────────────────────────────────────────────
  gateway-2:
    profiles:
      - ha
      - produccion-ogti
    build:
      context: ./servicios/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 200m
    environment:
      - "SESSION_SECRET=${SESSION_SECRET:?Debes definir SESSION_SECRET en tu archivo .env (ver .env.example)}"
      - AUTH_SERVICE_URL=http://auth-service:8001
      - APELACIONES_SERVICE_URL=http://apelaciones-service:8002
      - SUSTRACION_SERVICE_URL=http://sustracion-service:8003
      - SALA_SERVICE_URL=http://sala-service:8004
      - PROYECTOS_LEY_SERVICE_URL=http://proyectosley-service:8005
      - TRANSPARENCIA_SERVICE_URL=http://transparencia-service:8006
      - POI_PP117_SERVICE_URL=http://poi-service:8007
      - MAPA_SERVICE_URL=http://mapa-service:8008
      - AUDITORIA_SERVICE_URL=http://auditoria-service:8009
      - PREVENIR_PROTEGER_SERVICE_URL=http://prevenir-service:8010
      - NORMATIVA_SERVICE_URL=http://normativa-service:8011
      - TABLEROS_SERVICE_URL=http://tableros-service:8012
      - AYUDA_MEMORIA_SERVICE_URL=http://ayuda-memoria-service:8013
      - GESTION_DATOS_SERVICE_URL=http://gestion-datos-service:8014
    networks:
      - dgnna-net

  # ─────────────────────────────────────────────────────────────
  # 3. MICROSERVICIO: AUTH
  # ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./servicios/servicio-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 200m
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - "SESSION_SECRET=${SESSION_SECRET:?Debes definir SESSION_SECRET en tu archivo .env (ver .env.example)}"
      - DATABASE_URL=${DATABASE_URL_AUTH:-oracle+oracledb://auth_db:Auth2026@host.docker.internal:1521/?service_name=XEPDB1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dgnna-net

  # ─────────────────────────────────────────────────────────────
  # 4. MICROSERVICIO: APELACIONES
