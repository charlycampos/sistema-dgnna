    ports:
      - "8007:8007"
    environment:
      - PORT=8007
      - SESSION_SECRET=${SESSION_SECRET:-dgnna-sistema-dgnna-secret-2026}
      - DATABASE_URL=${DATABASE_URL_POI:-oracle+oracledb://poi_db:Poi2026@host.docker.internal:1521/?service_name=XEPDB1}
