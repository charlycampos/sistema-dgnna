/* ── FASE OPERATIVA PIPELINE ─────────────────────── */
function FaseStepper({fase}){
  const idx=Math.max(0,FASES.indexOf(fase));
  return(
    <div style={{display:'flex',alignItems:'center',gap:4,flex:1,minWidth:0}}>
      {FASES.map((f,i)=>{
        const done=i<idx,active=i===idx;
        return(
          <React.Fragment key={f}>
            <div title={f} style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
              <div style={{width:16,height:16,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:done?BL:active?'#EFF6FF':'#F1F5F9',border:active?`1.5px solid ${BL}`:'none'}}>
                {done?<IcoCheck size={8} c="#fff"/>:<span style={{fontSize:8,fontWeight:800,color:active?BL:TX3}}>{i+1}</span>}
              </div>
              <span style={{fontSize:9,fontWeight:active?800:600,color:active?BL:done?TX2:TX3,whiteSpace:'nowrap'}}>{f}</span>
            </div>
            {i<FASES.length-1&&<div style={{flex:1,height:2,minWidth:8,background:i<idx?BL:BR,borderRadius:99}}></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

  const tabs=[['todos','Todos'],['revision','Por revisar'],['subsanacion','Subsanación'],['retorno','Retorno voluntario'],['judicial','Judiciales'],['vencidos','Plazos vencidos'],['cerrados','Cerrados']];
  return(
    <main className="main-scroll" style={{flex:1,overflowY:'auto',background:BG,padding:'22px 24px'}}>
      <div style={{maxWidth:1280,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,marginBottom:18}}>
          <div>
            <div style={{fontSize:20,fontWeight:800,color:TX}}>Bandeja de casos</div>
            <div style={{fontSize:11,color:TX3,marginTop:4}}>Consulta y seguimiento de expedientes de sustracción internacional.</div>
          </div>
          <button onClick={onNuevo} style={{display:'flex',alignItems:'center',gap:6,background:N2,color:'#fff',border:0,borderRadius:7,padding:'9px 14px',fontSize:12,fontWeight:700}}><IcoPlus size={13}/> Nuevo caso</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:10,marginBottom:14}}>
          {counters.map(it=>(
            <div key={it.label} style={{background:SURF,border:`1px solid ${BR}`,borderRadius:7,padding:'12px 14px',borderLeft:`3px solid ${it.color}`}}>
              <div style={{fontSize:9,fontWeight:800,color:TX3,textTransform:'uppercase',letterSpacing:'.05em'}}>{it.label}</div>
              <div style={{fontSize:22,fontWeight:800,color:it.color,marginTop:4}}>{it.value}</div>
            </div>
          ))}
        </div>
        <div className="main-scroll" style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:10}}>
          {tabs.map(([id,label])=>(
            <button key={id} onClick={()=>setTab(id)} style={{padding:'7px 11px',borderRadius:6,border:`1px solid ${tab===id?BL:BR}`,background:tab===id?'#EFF6FF':SURF,color:tab===id?BL:TX2,fontSize:10,fontWeight:tab===id?800:600,whiteSpace:'nowrap'}}>{label}</button>
          ))}
        </div>
        <div style={{background:SURF,border:`1px solid ${BR}`,borderRadius:8,overflow:'hidden'}}>
          <div style={{padding:12,borderBottom:`1px solid ${BR}`,display:'grid',gridTemplateColumns:'minmax(210px,1.6fr) repeat(3,minmax(130px,.8fr)) auto',gap:8,alignItems:'center'}}>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:TX3}}><IcoSearch size={13}/></span>
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por NNA o Hoja de Trámite" style={{width:'100%',padding:'8px 10px 8px 28px',border:`1px solid ${BR}`,borderRadius:6,fontSize:11,color:TX,outline:'none',boxSizing:'border-box'}}/>
            </div>
            <select value={fe} onChange={e=>setFe(e.target.value)} style={bandejaSelS}><option value="">Todos los estados</option><option value="Tramite">En trámite</option><option value="Pendiente">Pendiente</option><option value="Archivado">Archivado</option></select>
            <select value={fp} onChange={e=>setFp(e.target.value)} style={bandejaSelS}><option value="">Todos los profesionales</option>{PROFESIONALES.map(p=><option key={p}>{p}</option>)}</select>
            <select value={fpais} onChange={e=>setFpais(e.target.value)} style={bandejaSelS}><option value="">Todos los países</option>{PAISES.map(p=><option key={p}>{p}</option>)}</select>
            <div style={{display:'flex',gap:5}}>
              <button title="Exportar" style={bandejaIcoBtn}><IcoDownload size={14}/></button>
              <button title="Limpiar" onClick={()=>{setQ('');setFe('');setFp('');setFpais('')}} style={bandejaIcoBtn}><IcoX size={13}/></button>
            </div>
          </div>
          <div style={{padding:'9px 14px',fontSize:10,color:TX3,borderBottom:`1px solid ${BR}`}}>Mostrando <b style={{color:TX2}}>{visibles.length}</b> de {casos.length} casos</div>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',minWidth:880}}>
              <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${BR}`,textAlign:'left'}}>
                {['NNA involucrados','Hoja de Trámite','País / AC Perú','Fase operativa','Profesional','Ingreso','Estado',''].map(l=><th key={l} style={{padding:'10px 12px',fontSize:9,fontWeight:800,color:TX3,textTransform:'uppercase',letterSpacing:'.04em'}}>{l}</th>)}
              </tr></thead>
              <tbody>
                {visibles.length===0&&<tr><td colSpan={8} style={{padding:40,textAlign:'center',fontSize:12,color:TX3}}>No se encontraron casos en esta bandeja.</td></tr>}
                {visibles.map(c=>{
                  const b=estadoBadge(c.estado);const dias=diasDesde(c.fechaIngreso);const p=c.procesoOperativo;
                  return(
                    <tr key={c.id} onClick={()=>onOpen(c)} style={{borderBottom:`1px solid ${BR}`,cursor:'pointer',background:SURF}}
                      onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'} onMouseLeave={e=>e.currentTarget.style.background=SURF}>
                      <td style={{padding:'11px 12px',minWidth:240}}>
                        <div style={{fontSize:12,fontWeight:700,color:TX}}>{nombreCaso(c)}</div>
                        <div style={{fontSize:10,color:TX3,marginTop:3}}>{c.nna?.length||0} NNA en el expediente</div>
                      </td>
                      <td style={bandejaCellS}><span style={{fontFamily:'monospace',fontWeight:700,color:N2}}>{c.codigo}</span></td>
                      <td style={bandejaCellS}><div>{c.pais}</div><div style={{fontSize:9,color:TX3,marginTop:2}}>{c.acPeru?`AC Perú ${c.acPeru}`:'AC Perú sin definir'}</div></td>
                      <td style={bandejaCellS}><div>{p?.faseOperativa||'Recepción'}</div>{p?.fechaLimite&&<div style={{fontSize:9,color:vencido(p.fechaLimite)?'#B91C1C':TX3,marginTop:2}}>Límite {fmtFecha(p.fechaLimite)}</div>}</td>
                      <td style={bandejaCellS}>{c.profesional||'Sin asignar'}</td>
                      <td style={bandejaCellS}><div>{fmtFecha(c.fechaIngreso)}</div>{dias>0&&c.estado!=='Archivado'&&<div style={{fontSize:9,color:TX3,marginTop:2}}>{dias} días</div>}</td>
                      <td style={bandejaCellS}><span style={{display:'inline-flex',padding:'3px 8px',borderRadius:99,background:b.bg,color:b.color,border:`1px solid ${b.border}`,fontSize:10,fontWeight:700}}>{b.label}</span></td>
                      <td style={{padding:'11px 12px',textAlign:'right'}}><button style={bandejaIcoBtn}><IcoChevR size={13}/></button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  );
}

/* ── EXPEDIENTE NAV ───────────────────────────────── */
const SECCIONES=[
  {label:'Vista general',items:[['resumen','Resumen del caso']]},
  {label:'Registro',items:[['datos','Datos del caso'],['personas','Personas involucradas']]},
  {label:'Evaluación',items:[['evaluacion','Evaluación inicial'],['subsanacion','Requisitos y subsanación']]},
  {label:'Gestión',items:[['internacional','Gestión internacional'],['retorno','Retorno voluntario'],['bitacora','Historial de gestión']]},
  {label:'Resultado',items:[['judicial','Proceso judicial'],['cierre','Cierre del caso']]},
];
const TITULOS={
  resumen:['Resumen del caso','Información vigente y situación general del expediente.'],
  datos:['Datos del caso','Identificación, clasificación y datos del trámite.'],
  personas:['Personas involucradas','NNA, solicitante y persona requerida vinculados al caso.'],
  evaluacion:['Evaluación inicial','Verificación de requisitos y resultado de la revisión inicial.'],
  subsanacion:['Requisitos y subsanación','Control de observaciones, respuesta y fechas aplicables.'],
  internacional:['Gestión internacional','Comunicaciones, referencia SGD y próxima actuación.'],
  retorno:['Retorno voluntario','Entrevista, propuesta, compromisos y resultado del retorno.'],
  bitacora:['Historial de gestión','Registro cronológico de las actuaciones realizadas.'],
  judicial:['Proceso judicial','Datos e historial de la intervención judicial.'],
  cierre:['Cierre del caso','Resultado final, retorno y motivo de cierre.'],
};

function ExpedienteNav({active,onChange}){
  return(
    <aside className="main-scroll" style={{width:244,flexShrink:0,background:SURF,borderRight:`1px solid ${BR}`,padding:'16px 12px',overflowY:'auto'}}>
      {SECCIONES.map((sec,i)=>(
        <div key={sec.label} style={{marginTop:i?18:0}}>
          <div style={{padding:'0 10px 6px',fontSize:9,fontWeight:800,color:TX3,textTransform:'uppercase',letterSpacing:'.09em'}}>{sec.label}</div>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            {sec.items.map(([id,label])=>{
              const sel=active===id;
              return(
                <button key={id} onClick={()=>onChange(id)} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'9px 10px',borderRadius:7,border:sel?'1px solid #BFDBFE':'1px solid transparent',background:sel?'#EFF6FF':'transparent',color:sel?BL:TX2,fontSize:12,fontWeight:sel?700:600,textAlign:'left'}}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:sel?BL:BR,flexShrink:0}}></span>{label}
                </button>
              );
            })}
          </div>
        </div>
      ))}
    </aside>
  );
}

/* ── FICHA CELDA ───────────────────────────────────── */
function Row({label,value,type='text',opts,span=1,onChange}){
  const inpS={width:'100%',padding:'7px 10px',border:`1.5px solid ${BR}`,borderRadius:7,fontSize:12,color:TX,background:'#FAFBFD',outline:'none'};
  return(
    <div style={{gridColumn:`span ${span}`,padding:'12px 14px',borderRight:`1px solid ${BR}`,borderBottom:`1px solid ${BR}`}}>
      <div style={{fontSize:10,fontWeight:700,color:TX3,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:5}}>{label}</div>
      {type==='select'?(
        <select value={value||''} onChange={e=>onChange(e.target.value)} style={{...inpS,cursor:'pointer'}}>
          <option value="">—</option>{opts.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      ):type==='textarea'?(
        <textarea rows={2} value={value||''} onChange={e=>onChange(e.target.value)} style={{...inpS,resize:'none'}}/>
      ):(
        <input type={type} value={value||''} onChange={e=>onChange(e.target.value)} style={inpS}/>
      )}
    </div>
  );
}
function Sec({title}){
  return <div style={{gridColumn:'span 4',background:'#F1F5F9',padding:'8px 14px',borderBottom:`1px solid ${BR}`,fontSize:10,fontWeight:800,color:N2,textTransform:'uppercase',letterSpacing:'.06em'}}>{title}</div>;
}

/* ── TAB: DATOS DEL CASO ───────────────────────────── */
function TabDatos({caso,onChange}){
  return(
    <div className="main-scroll" style={{flex:1,overflowY:'auto'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)'}}>
        <Sec title="Identificación del trámite"/>
        <Row label="Hoja de trámite / Código" value={caso.codigo} onChange={v=>onChange('codigo',v)}/>
        <Row label="País contraparte" value={caso.pais} type="select" opts={PAISES} onChange={v=>onChange('pais',v)}/>
        <Row label="Etapa" value={caso.etapa} type="select" opts={ETAPAS} onChange={v=>onChange('etapa',v)}/>
        <Row label="Tipo de solicitud" value={caso.tipoSolicitud} type="select" opts={TIPO_SOL} onChange={v=>onChange('tipoSolicitud',v)}/>
        <Row label="AC Perú" value={caso.acPeru} type="select" opts={AC_PERU} onChange={v=>onChange('acPeru',v)}/>
        <Row label="Profesional" value={caso.profesional} type="select" opts={PROFESIONALES} onChange={v=>onChange('profesional',v)}/>
        <Row label="Fecha de ingreso" value={caso.fechaIngreso} type="date" onChange={v=>onChange('fechaIngreso',v)}/>
        <Row label="Fecha de salida / cierre" value={caso.fechaSalida} type="date" onChange={v=>onChange('fechaSalida',v)}/>
        <Sec title="Observaciones"/>
        <Row label="Observaciones generales" value={caso.observaciones} type="textarea" span={4} onChange={v=>onChange('observaciones',v)}/>
      </div>

}

/* ── TAB: PERSONAS (NNA múltiples + solicitante + requerido) ── */

  return(
    <div className="main-scroll" style={{flex:1,overflowY:'auto'}}>
      <div style={{padding:14,borderBottom:`1px solid ${BR}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div>
            <b style={{fontSize:11,color:N2,display:'block'}}>NNA INVOLUCRADOS</b>
            <span style={{fontSize:11,color:TX3}}>{(caso.nna||[]).length} registrado{(caso.nna||[]).length===1?'':'s'} en el expediente</span>
          </div>
          <button style={{display:'flex',alignItems:'center',gap:6,padding:'7px 11px',border:0,borderRadius:7,background:N2,color:'#fff',fontSize:11,fontWeight:700}}><IcoPlus size={12}/> Agregar NNA</button>
        </div>
        <div style={{overflowX:'auto',border:`1px solid ${BR}`,borderRadius:8}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:11,background:'#fff'}}>
            <thead><tr style={{textAlign:'left',color:TX3,textTransform:'uppercase',fontSize:10,background:'#F8FAFC',borderBottom:`1px solid ${BR}`}}>
              <th style={{padding:'9px 12px',width:54}}>N.°</th><th style={{padding:'9px 12px'}}>NNA</th><th style={{padding:'9px 12px'}}>Sexo</th><th style={{padding:'9px 12px'}}>Nacimiento</th><th style={{padding:'9px 12px'}}>Edad</th><th style={{padding:'9px 12px',width:88,textAlign:'right'}}>Acciones</th>
            </tr></thead>
            <tbody>

                  <td style={{padding:'10px 12px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:9}}>
                      <div style={{width:28,height:28,borderRadius:'50%',background:'#EFF6FF',color:BL,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:11,fontWeight:700}}>{n.nombres[0]}</div>
                      <div><div style={{fontWeight:700,color:TX,fontSize:12}}>{nombreNna(n)}</div><div style={{color:TX3,fontSize:10,marginTop:1}}>Niña, niño o adolescente</div></div>
                    </div>

                  <td style={{padding:'10px 12px',color:TX2}}>{n.sexo||'—'}</td>
                  <td style={{padding:'10px 12px',color:TX2}}>{n.fechaNacimiento||'—'}</td>

                      <button style={{width:28,height:28,border:'1px solid #FECACA',borderRadius:6,background:'#FEF2F2',color:'#DC2626',display:'flex',alignItems:'center',justifyContent:'center'}}><IcoTrash size={12}/></button>

        <Row label="Teléfono" value={caso.solicitanteTelefono} onChange={v=>onChange('solicitanteTelefono',v)}/>

/* ── PROCESO OPERATIVO (evaluacion/subsanacion/internacional/retorno) ── */
const procInpS={width:'100%',padding:'8px 10px',border:`1px solid ${BR}`,borderRadius:6,fontSize:11,color:TX,background:SURF,outline:'none',boxSizing:'border-box'};
const procLblS={display:'flex',flexDirection:'column',gap:5,fontSize:9,fontWeight:800,color:TX3,textTransform:'uppercase',letterSpacing:'.04em'};
const procPanelS={background:SURF,border:`1px solid ${BR}`,borderRadius:8,overflow:'hidden'};
const procHeadS={padding:'12px 14px',background:'#F8FAFC',borderBottom:`1px solid ${BR}`,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,fontSize:12,color:TX};
const procGridS={display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gap:12,padding:14};

function Field({label,value,onChange,type='text',opts}){
  return(
    <label style={procLblS}>{label}
      {type==='select'?(
        <select value={value||''} onChange={e=>onChange(e.target.value)} style={procInpS}>
          <option value="">—</option>{opts.map(o=><option key={o} value={o}>{o||'—'}</option>)}
        </select>
      ):type==='textarea'?(
        <textarea rows={3} value={value||''} onChange={e=>onChange(e.target.value)} style={{...procInpS,resize:'none'}}/>
      ):(
        <input type={type} value={value||''} onChange={e=>onChange(e.target.value)} style={procInpS}/>
      )}
    </label>
  );
}

function TabEvaluacion({proceso,setProceso}){
  const completos=proceso.requisitos.filter(r=>r.estado==='Completo').length;
  return(
    <div style={{flex:1,overflowY:'auto',padding:'20px 24px'}} className="main-scroll">
      <div style={procPanelS}>
        <div style={procHeadS}>
          <div><b>Lista de verificación</b><span style={{display:'block',fontSize:10,color:TX3,marginTop:2}}>{completos} de {proceso.requisitos.length} atendidos</span></div>
          <select value={proceso.evaluacionResultado||''} onChange={e=>setProceso({...proceso,evaluacionResultado:e.target.value})} style={{...procInpS,width:190}}>
            <option value="">Pendiente de evaluación</option>{['Completa','Observada','No corresponde'].map(x=><option key={x}>{x}</option>)}
          </select>
        </div>
        <div>
          {proceso.requisitos.map((r,i)=>(
            <div key={r.id} style={{display:'grid',gridTemplateColumns:'36px minmax(0,1fr) 170px',alignItems:'center',gap:10,padding:'10px 14px',borderTop:i?`1px solid ${BR}`:'none'}}>
              <div style={{width:24,height:24,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:r.estado==='Completo'?'#DCFCE7':'#F1F5F9',color:r.estado==='Completo'?'#15803D':TX3,fontSize:11,fontWeight:700}}>{r.estado==='Completo'?<IcoCheck size={11}/>:i+1}</div>
              <div style={{fontSize:12,fontWeight:600,color:TX}}>{r.nombre}</div>
              <select value={r.estado} onChange={e=>setProceso({...proceso,requisitos:proceso.requisitos.map(x=>x.id===r.id?{...x,estado:e.target.value}:x)})} style={procInpS}>
                {['Pendiente','Completo','Observado','No aplica'].map(x=><option key={x}>{x}</option>)}
              </select>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function TabSubsanacion({proceso,setProceso}){
  const set=k=>v=>setProceso({...proceso,[k]:v});
  return(
    <div style={{flex:1,overflowY:'auto',padding:'20px 24px'}} className="main-scroll">
      <div style={procPanelS}>
        <div style={procHeadS}>
          <div><b>Control de subsanación</b><span style={{display:'block',fontSize:10,color:TX3,marginTop:2}}>Fechas y resultado de las observaciones comunicadas.</span></div>
          {vencido(proceso.fechaLimiteSubsanacion)&&!proceso.fechaRespuestaSubsanacion&&<span style={{fontSize:10,fontWeight:800,color:'#B91C1C',background:'#FEF2F2',padding:'5px 8px',borderRadius:6}}>PLAZO VENCIDO</span>}
        </div>
        <div style={procGridS}>
          <Field label="Fecha de observación" type="date" value={proceso.fechaObservacion} onChange={set('fechaObservacion')}/>
          <Field label="Fecha de notificación" type="date" value={proceso.fechaNotificacion} onChange={set('fechaNotificacion')}/>
          <Field label="Fecha límite" type="date" value={proceso.fechaLimiteSubsanacion} onChange={set('fechaLimiteSubsanacion')}/>
          <Field label="Ampliación" type="select" opts={['No','Sí']} value={proceso.ampliacionSubsanacion} onChange={set('ampliacionSubsanacion')}/>
          <Field label="Fecha de respuesta" type="date" value={proceso.fechaRespuestaSubsanacion} onChange={set('fechaRespuestaSubsanacion')}/>
          <div style={{gridColumn:'1 / -1',fontSize:11,color:TX3}}>Los requisitos observados se administran en Evaluación inicial. El vencimiento genera alerta, no cambia automáticamente la decisión.</div>
        </div>
      </div>
    </div>
  );
}

function TabInternacional({caso,proceso,setProceso}){
  const set=k=>v=>setProceso({...proceso,[k]:v});
  return(
    <div style={{flex:1,overflowY:'auto',padding:'20px 24px'}} className="main-scroll">
      <div style={procPanelS}>
        <div style={procHeadS}>
          <div><b>Comunicación y seguimiento</b><span style={{display:'block',fontSize:10,color:TX3,marginTop:2}}>AC Perú {caso.acPeru||'sin definir'} · {caso.pais}</span></div>
          {vencido(proceso.fechaLimite)&&<span style={{fontSize:10,fontWeight:800,color:'#B91C1C'}}>ACCIÓN VENCIDA</span>}

        </div>
        <DashCard title="NNA por sexo">
          <div style={{display:'flex',gap:12,marginBottom:14}}>
            <div style={{flex:1,background:'#EFF6FF',borderRadius:8,padding:'10px 12px',textAlign:'center'}}><p style={{fontSize:22,fontWeight:700,color:BL}}>{hombres}</p><p style={{fontSize:10,color:'#3B82F6',textTransform:'uppercase'}}>Hombres</p></div>
            <div style={{flex:1,background:'#FDF2F8',borderRadius:8,padding:'10px 12px',textAlign:'center'}}><p style={{fontSize:22,fontWeight:700,color:'#DB2777'}}>{mujeres}</p><p style={{fontSize:10,color:'#EC4899',textTransform:'uppercase'}}>Mujeres</p></div>
          </div>
          <div style={{height:10,borderRadius:99,overflow:'hidden',display:'flex',gap:2}}>
            {hombres>0&&<div style={{flex:hombres,background:'#3B82F6',borderRadius:99}}></div>}
            {mujeres>0&&<div style={{flex:mujeres,background:'#EC4899',borderRadius:99}}></div>}
          </div>
        </DashCard>
        <DashCard title="Estado del trámite">
          <ProgressBar label="En trámite" count={enTramite} tot={total} color={BL}/>
          <ProgressBar label="Pendiente" count={enPendiente} tot={total} color="#F59E0B"/>
          <ProgressBar label="Archivados" count={archivados} tot={total} color="#10B981"/>
        </DashCard>
        <DashCard title="Casos por país">
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {porPais.map(({p,n})=>(
              <div key={p} style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:11,color:TX2,fontWeight:600,width:110,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p}</span>
                <div style={{flex:1,background:BG,borderRadius:99,height:16,overflow:'hidden'}}>
                  <div style={{height:'100%',borderRadius:99,background:`linear-gradient(90deg,${BL},#7C3AED)`,width:`${Math.round(n/maxPais*100)}%`,display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:6}}>
                    <span style={{fontSize:9,color:'#fff',fontWeight:700}}>{n}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </DashCard>
        <DashCard title="Profesionales">
          {PROFESIONALES.map(p=>{
            const n=casos.filter(c=>c.profesional===p).length;
            return(
              <div key={p} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                <div style={{width:26,height:26,borderRadius:'50%',background:`linear-gradient(135deg,${BL},#7C3AED)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:800,color:'#fff'}}>{p[0]}</div>
                <div style={{flex:1}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}><span style={{fontSize:12,fontWeight:600,color:TX2}}>{p}</span><span style={{fontSize:11,color:TX3,fontWeight:700}}>{n}</span></div>
                  <div style={{height:5,background:BG,borderRadius:99,overflow:'hidden'}}><div style={{height:'100%',borderRadius:99,background:`linear-gradient(90deg,${BL},#7C3AED)`,width:`${total>0?Math.round(n/total*100):0}%`}}></div></div>
                </div>
              </div>
            );
          })}
        </DashCard>
      </div>
    </main>
  );
}

/* ── APP ──────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"navWidth":244}/*EDITMODE-END*/;

function App(){
  const [tweaks,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const [casos,setCasos]=useState(SAMPLE);
  const [selected,setSelected]=useState(null);
  const [view,setView]=useState('casos');
  const [tab,setTab]=useState('resumen');
  const [proceso,setProceso]=useState(null);

  const openCase=c=>{setSelected(c);setTab('resumen');setProceso(c.procesoOperativo||{faseOperativa:'Recepción',requisitos:REQ_BASE});};
  const closeCase=()=>{
    if(selected&&proceso)setCasos(cs=>cs.map(c=>c.id===selected.id?{...c,procesoOperativo:proceso}:c));
    setSelected(null);
  };
  const onChange=(field,val)=>setSelected(prev=>({...prev,[field]:val}));
  const saveProceso=p=>{setProceso(p);setCasos(cs=>cs.map(c=>c.id===selected.id?{...c,procesoOperativo:p}:c));};
  const addBit=texto=>{
    const b={id:`b${++_nid}`,fecha:todayStr(),texto,creadoPor:'Usuario actual'};
    setSelected(prev=>{const up={...prev,bitacora:[...prev.bitacora,b]};setCasos(cs=>cs.map(c=>c.id===up.id?up:c));return up;});
  };
  const addHj=entry=>{
    setSelected(prev=>{
      const up={...prev,estadoJudicial:entry.etapa,historialJudicial:[...(prev.historialJudicial||[]),entry]};
      setCasos(cs=>cs.map(c=>c.id===up.id?up:c));return up;
    });
  };

  const b=selected?estadoBadge(selected.estado):null;

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:BG}}>
      <header style={{background:SURF,flexShrink:0,borderBottom:`1px solid ${BR}`,boxShadow:'0 1px 3px rgba(0,0,0,.05)'}}>
        <div style={{padding:'0 20px',display:'flex',alignItems:'center',gap:12,height:56}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:32,height:32,borderRadius:9,background:BL,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:'#fff'}}><IcoGlobe size={15} c="#fff"/></div>
            <div>
              <div style={{fontSize:10,color:TX3,textTransform:'uppercase',letterSpacing:'.5px'}}>DGNNA — MIMP</div>
              <div style={{fontSize:14,fontWeight:800,color:TX,letterSpacing:'-.01em'}}>Sustracción Internacional</div>
            </div>
          </div>
          <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
            <button onClick={()=>{setSelected(null);setView(view==='casos'?'dashboard':'casos')}}
              style={{display:'flex',alignItems:'center',gap:6,background:view==='dashboard'?BL:BG,color:view==='dashboard'?'#fff':TX2,border:`1px solid ${view==='dashboard'?BL:BR}`,borderRadius:8,padding:'7px 13px',fontSize:12,fontWeight:600}}>
              {view==='casos'?<><IcoChart size={13}/> Estadísticas</>:<><IcoFile size={13}/> Registro</>}
            </button>
            {(selected||view==='dashboard')&&<button style={{display:'flex',alignItems:'center',gap:5,background:BL,color:'#fff',border:'none',borderRadius:8,padding:'7px 13px',fontSize:12,fontWeight:700}}><IcoPlus size={13}/> Nuevo caso</button>}
          </div>
        </div>
      </header>

      {view==='dashboard'?<Dashboard casos={casos}/>:
       !selected?<Bandeja casos={casos} onOpen={openCase} onNuevo={()=>{}}/>:
      (
        <div className="anim-r" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <div style={{background:SURF,padding:'12px 20px',borderBottom:`1px solid ${BR}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,gap:16}}>
            <button onClick={closeCase} style={{width:34,height:34,borderRadius:8,border:`1px solid ${BR}`,background:SURF,color:TX2,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><IcoArrowL size={15}/></button>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10,color:TX3,textTransform:'uppercase',letterSpacing:'.04em',fontWeight:700,marginBottom:2}}>Expediente · HT {selected.codigo}</div>
              <div style={{fontSize:18,fontWeight:800,color:TX,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{nombreCaso(selected)}</div>
              <div style={{display:'flex',gap:7,marginTop:4,fontSize:10,color:TX3,flexWrap:'wrap'}}>
                <span>{selected.pais}</span><span>·</span><span>AC Perú {selected.acPeru||'sin definir'}</span><span>·</span><span>{selected.nna?.length||0} NNA</span><span>·</span><span>{selected.profesional}</span><span>·</span><b style={{color:BL}}>Fase: {proceso?.faseOperativa||'Recepción'}</b>
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
              <select value={selected.estado} onChange={e=>onChange('estado',e.target.value)} style={{fontSize:12,padding:'5px 10px',borderRadius:99,background:b.bg,color:b.color,border:`1px solid ${b.border}`,fontWeight:700,outline:'none'}}>
                <option value="Tramite">En trámite</option><option value="Pendiente">Pendiente</option><option value="Archivado">Archivado</option>
              </select>
              <button style={{width:32,height:32,borderRadius:8,border:'1px solid #FECACA',background:'#FEF2F2',display:'flex',alignItems:'center',justifyContent:'center',color:'#DC2626'}}><IcoTrash size={13} c="#DC2626"/></button>
            </div>
          </div>
          <div style={{flex:1,display:'flex',overflow:'hidden',minHeight:0}}>
            <ExpedienteNav active={tab} onChange={setTab}/>
            <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0,background:BG}}>
              <div style={{padding:'12px 24px',background:SURF,borderBottom:`1px solid ${BR}`,flexShrink:0}}>
                <div style={{fontSize:15,fontWeight:800,color:TX}}>{TITULOS[tab][0]}</div>
                <div style={{fontSize:10,color:TX3,marginTop:3}}>{TITULOS[tab][1]}</div>
              </div>
              {tab==='resumen'&&<TabResumen caso={{...selected,procesoOperativo:proceso}}/>}
              {tab==='datos'&&<TabDatos caso={selected} onChange={onChange}/>}
              {tab==='personas'&&<TabPersonas caso={selected} onChange={onChange}/>}
              {tab==='evaluacion'&&<TabEvaluacion proceso={proceso} setProceso={saveProceso}/>}
              {tab==='subsanacion'&&<TabSubsanacion proceso={proceso} setProceso={saveProceso}/>}
              {tab==='internacional'&&<TabInternacional caso={selected} proceso={proceso} setProceso={saveProceso}/>}
              {tab==='retorno'&&<TabRetorno caso={selected} proceso={proceso} setProceso={saveProceso} onCasoChange={onChange}/>}
              {tab==='bitacora'&&<TabBitacora caso={selected} addEntry={addBit}/>}
              {tab==='judicial'&&<TabJudicial caso={selected} onChange={onChange} historial={selected.historialJudicial||[]} onAdd={addHj}/>}
              {tab==='cierre'&&<TabCierre caso={selected} onChange={onChange}/>}
            </div>
          </div>
        </div>
      )}

      <TweaksPanel>
        <TweakSection title="Diseño">
          <TweakSlider id="navWidth" label="Ancho nav expediente" min={200} max={320} step={10} value={tweaks.navWidth} onChange={v=>setTweak('navWidth',v)}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
