events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" $request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Cluster de API Gateway para alta disponibilidad (sin punto único de fallo)
    upstream api_gateway_cluster {
        least_conn; # Distribución de carga por menor número de conexiones activas
        server gateway:8000 max_fails=3 fail_timeout=10s;
        # server gateway-2:8000 max_fails=3 fail_timeout=10s; # Descomentar cuando la OGTI active el perfil HA (--profile ha)
        keepalive 32;
    }

    server {
        listen 80;
        listen 8000;
        server_name localhost;

        client_max_body_size 50M;

        # Healthcheck propio del Balanceador
        location /lb-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","balancer":"nginx","cluster":"api_gateway_cluster"}';
        }

        # Redirección y balanceo hacia el clúster de API Gateways
        location / {
            proxy_pass http://api_gateway_cluster;
            proxy_http_version 1.1;
            
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts para operaciones de IA / RAG o carga de archivos grandes
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Reintentar automáticamente en caso de fallo de una réplica
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}
